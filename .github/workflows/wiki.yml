# Copies the wiki/ folder to the GitHub wiki on every push to main that touches it.
# (The wiki must have a first page, created once on github.com, before this can push to it.)
name: Sync wiki
on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push wiki/ to the wiki repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
          rsync -a --delete --exclude .git wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Wiki already up to date"; exit 0; }
          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push
