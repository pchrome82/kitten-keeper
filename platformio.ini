; Kitten Keeper for Waveshare ESP32-S3-Touch-AMOLED-1.8 (env amoled18) and ESP32-S3-Touch-AMOLED-2.16 (env amoled216)
;   pio run -e amoled18 -t upload      or  -e amoled216          (pio run alone builds both)
[platformio]
default_envs = amoled18, amoled216

; Uses pioarduino (Arduino-ESP32 3.x) because the audio path uses the ESP_I2S library.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi   ; 8 MB octal PSRAM (ESP32-S3R8)
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wno-unused-variable
lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.4

[env:amoled18]

[env:amoled216]
; 480x480 CO5300 panel, CST9220 touch. The game picture (368x448) is centred on it.
; If the picture or the touch comes out turned / mirrored on your unit, add any of these to build_flags below:
;   -DKK_LCD_MADCTL=0xA0   -DKK_TOUCH_SWAP_XY=1   -DKK_TOUCH_MIRROR_X=1   -DKK_TOUCH_MIRROR_Y=1
build_flags =
    ${env.build_flags}
    -DKK_BOARD_AMOLED216

[env:lcd183]
; SHELVED (v1.2.2): not built by default and no longer maintained. Known problems: washed-out colours needing
; software correction, and taps landing stretched out from the middle (PLAY hits FEED, SHOP hits MENU).
; Still builds on request with: pio run -e lcd183
; 240x284 ST7789P LCD on SPI, CST816 touch. The game picture (368x448) is scaled down to fill it.
; -DKK_LCD_SPI_HZ=80000000 pushes the picture faster, if the panel takes it.
; Colour correction (percent, 100 = off; defaults 150 / 125): -DKK_LCD_GAMMA=... darkens the mid-tones, -DKK_LCD_SAT=... strengthens the colours.
; -DKK_LCD_PANEL_INIT=1 tries the bare panel start-up instead (factory gamma, like Waveshare's ESP-IDF code; looked worse).
build_flags =
    ${env.build_flags}
    -DKK_BOARD_LCD183
    -DKK_DEFAULT_BRIGHT=5          ; a fresh save starts at brightness 5
    -DKK_DEFAULT_SCREEN_OFF=5      ; and the screen goes off after 30 s
